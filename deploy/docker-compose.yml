# Local development PostgreSQL for YeaKazi.
#   docker compose -f deploy/docker-compose.yml up -d
# The init scripts create the three YeaKazi roles and the `yeakazi` database on first start.
# Dev-only credentials; never use these outside a developer machine.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - yeakazi-pg:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
volumes:
  yeakazi-pg:
